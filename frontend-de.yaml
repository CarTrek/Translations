    cars.editor.COMMANDSMANUAL:
      de: Gerätebefehle. TCP - Befehl über GPRS/LTE senden. SMS - Befehl per SMS an die eingerichtete Telefonnummer senden
    cars.editor.OPTIONSMANUAL:
      de: Optionen - spezielle Einstellungen, die das Verhalten des Fahrzeugs im System bestimmen. Optionen interpretieren die Zustände von Sensoren oder Rohdaten in Fahrzeugzustände wie Zündung, Türstatus, Batterieladung, Kraftstoffstand usw. Mithilfe der Optionen können Sie auch periodische Skripte erstellen, die verfügbaren Funktionen des Fahrzeugs bestimmen, Datenquellen festlegen (z.B. Kilometerstand von CAN oder GPS nehmen), das Verhalten von Algorithmen (z.B. ob die Motorhaube geprüft werden soll) und die Filterung von SMS-Nachrichten.
    cars.editor.HALMANUAL:
      de: Sensoren, die für alle Gerätetypen standardisiert sind. Der aktuelle Zustand dieser Sensoren kann in Skripten und Optionen durch Aufruf von Hal('SensorName') abgerufen werden.
    cars.editor.HALFILES:
      de: Firmware und Konfigurationsdateien. Klicken Sie auf den Dateinamen, um die Datei auf Ihr Gerät hochzuladen.
    cars.editor.HALMANUALALL:
      de: Liste aller möglichen Sensoren, die dieser Gerätetyp senden kann. Wenn der aktuelle Wert nicht sichtbar ist, hat das Gerät ihn noch nie gesendet. Welche Sensoren und wann sie an den Server gesendet werden, wird durch die Hardware-Einstellungen bestimmt.
    cars.editor.RAWMANUAL:
      de: Rohdaten von Sensoren, die von Geräten gesendet werden. Die Namen der Sensoren hängen vom Gerätetyp und vom gewählten Protokoll zur Datenübertragung an den Server ab. Der aktuelle Zustand der Rohdaten kann in Skripten und Optionen durch Aufruf von Raw('SensorName') abgerufen werden.
    cars.editor.JSMANUAL:
      de: Ein Skript, das die Logik der Arbeit mit diesem Fahrzeug implementiert. Das Skript wird basierend auf den angegebenen Optionen und Befehlen für die ausgewählte Logik erstellt. Sie können Optionen und Befehle in der Datei hardware.json bearbeiten.
    tecTracker.OfflineCustomerManual:
      de: 'Algorithmus zur Notverriegelung der Türen mit Motorblockierung bei Fahrzeugen mit TEK-Terminals <br>a) Öffnen Sie die Fahrertür und lassen Sie sie offen, während alle anderen Türen, Motorhaube und Kofferraum geschlossen sein müssen <br>b) Schalten Sie die Zündung ein <br>c) Drücken Sie unmittelbar nach dem Einschalten der Zündung 5 Mal das Bremspedal bei eingeschalteter Zündung: <br>- Drücken mit einer Pause von etwa 1 Sekunde <br>- Halten Sie das Pedal etwa 1 Sekunde lang gedrückt <br>d) Die Blinkleuchten blinken 1 Mal <br>e) Schalten Sie die Zündung aus <br>f) Steigen Sie aus dem Fahrzeug und schließen Sie die Tür <br>g) 10 Sekunden nach dem Schließen der Tür wird die Zentralverriegelung des Fahrzeugs verriegelt, die Blinker blinken, die Motorblockierung schaltet sich ein, der Türverriegelungsvorgang wird abgebrochen.'
