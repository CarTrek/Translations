    map.location.permissionDescription:
      en: Your location is used to show you on the map and find nearby vehicles.
      ru: Геопозиция используется для отображения вас на карте и поиска транспорта поблизости.
      cs: Vaše poloha slouží k zobrazení na mapě a vyhledání vozidel v okolí.
      fr: Votre position permet de vous afficher sur la carte et de trouver des véhicules à proximité.
      az: Məkanınız sizi xəritədə göstərmək və yaxınlıqdakı nəqliyyat vasitələrini tapmaq üçün istifadə olunur.
      de: Ihr Standort wird verwendet, um Sie auf der Karte anzuzeigen und Fahrzeuge in der Nähe zu finden.
      es: Tu ubicación se utiliza para mostrarte en el mapa y encontrar vehículos cercanos.
      it: La tua posizione viene utilizzata per mostrarti sulla mappa e trovare veicoli nelle vicinanze.
      pt: Sua localização é usada para mostrar você no mapa e encontrar veículos próximos.
      uk: Геопозиція використовується для відображення вас на карті та пошуку транспорту поблизу.
      sk: Vaša poloha sa používa na zobrazenie na mape a vyhľadanie vozidiel v okolí.
      sr: Ваша локација се користи за приказ на мапи и проналажење возила у близини.
      hy: Ձեր տեղադրությունն օգտագործվում է ձեզ քարտեզի վրա ցուցադրելու և մոտակա մեքենաները գտնելու համար։
      kk: Орналасқан жеріңіз сізді картада көрсету және жақын жердегі көліктерді табу үшін пайдаланылады.
      ms: Lokasi anda digunakan untuk menunjukkan anda pada peta dan mencari kenderaan berdekatan.
      tg: Ҷойгиршавии шумо барои нишон додани шумо дар харита ва ёфтани нақлиёти наздик истифода мешавад.
      uz: Joylashuvingiz sizni xaritada ko‘rsatish va yaqin atrofdagi transport vositalarini topish uchun ishlatiladi.
      zh: 您的位置用于在地图上显示您的位置并查找附近的车辆。
      vi: Vị trí của bạn được dùng để hiển thị bạn trên bản đồ và tìm xe ở gần.
      th: ตำแหน่งของคุณใช้เพื่อแสดงคุณบนแผนที่และค้นหารถที่อยู่ใกล้เคียง
