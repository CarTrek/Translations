    map.location.unavailable:
      en: Unable to determine your location. Check location access and try again.
      ru: Не удалось определить местоположение. Проверьте доступ к геолокации и попробуйте снова.
      az: Məkanınızı müəyyən etmək mümkün olmadı. Məkan icazəsini yoxlayın və yenidən cəhd edin.
      cs: Polohu se nepodařilo určit. Zkontrolujte přístup k poloze a zkuste to znovu.
      de: Ihr Standort konnte nicht ermittelt werden. Prüfen Sie den Standortzugriff und versuchen Sie es erneut.
      es: No se pudo determinar tu ubicación. Comprueba el acceso a la ubicación e inténtalo de nuevo.
      fr: Impossible de déterminer votre position. Vérifiez l’accès à la localisation et réessayez.
      hy: Չհաջողվեց որոշել ձեր գտնվելու վայրը։ Ստուգեք տեղորոշման թույլտվությունը և կրկին փորձեք։
      it: Impossibile determinare la tua posizione. Controlla l’accesso alla posizione e riprova.
      kk: Орналасқан жеріңізді анықтау мүмкін болмады. Геолокацияға рұқсатты тексеріп, қайталап көріңіз.
      ms: Lokasi anda tidak dapat ditentukan. Semak akses lokasi dan cuba lagi.
      pt: Não foi possível determinar a sua localização. Verifique o acesso à localização e tente novamente.
      sk: Polohu sa nepodarilo určiť. Skontrolujte prístup k polohe a skúste to znova.
      sr: Није могуће одредити вашу локацију. Проверите приступ локацији и покушајте поново.
      tg: Ҷойгиршавии шумо муайян нашуд. Дастрасӣ ба ҷойгиршавиро санҷед ва дубора кӯшиш кунед.
      th: ไม่สามารถระบุตำแหน่งได้ โปรดตรวจสอบสิทธิ์การเข้าถึงตำแหน่งแล้วลองอีกครั้ง
      uk: Не вдалося визначити місцеперебування. Перевірте доступ до геолокації та спробуйте знову.
      uz: Joylashuvingizni aniqlab bo‘lmadi. Joylashuvga ruxsatni tekshiring va qayta urinib ko‘ring.
      vi: Không thể xác định vị trí của bạn. Hãy kiểm tra quyền truy cập vị trí và thử lại.
      zh: 无法确定您的位置。请检查定位权限后重试。
