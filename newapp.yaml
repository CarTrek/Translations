    auth.signUp.retryWarning:
      en: The previous request may still be processing. Check the conversation first. Sending again may duplicate the reply.
      ru: Предыдущий запрос ещё может обрабатываться. Сначала проверьте диалог. При повторной отправке возможен дубликат.
      cs: Předchozí požadavek se možná stále zpracovává. Nejprve zkontrolujte konverzaci. Další odeslání může odpověď zdvojit.
      fr: La demande précédente est peut-être toujours en cours de traitement. Vérifiez d’abord la conversation. Un nouvel envoi peut créer un doublon.
      az: Əvvəlki sorğu hələ emal oluna bilər. Əvvəlcə söhbəti yoxlayın. Yenidən göndərmək cavabın təkrarlanmasına səbəb ola bilər.
      de: Die vorherige Anfrage wird möglicherweise noch bearbeitet. Prüfen Sie zuerst den Chat. Erneutes Senden kann die Antwort duplizieren.
      es: Es posible que la solicitud anterior siga procesándose. Revisa primero la conversación. Volver a enviar puede duplicar la respuesta.
      it: La richiesta precedente potrebbe essere ancora in elaborazione. Controlla prima la conversazione. Un nuovo invio potrebbe duplicare la risposta.
      pt: A solicitação anterior pode ainda estar sendo processada. Confira a conversa primeiro. Enviar novamente pode duplicar a resposta.
      uk: Попередній запит може досі оброблятися. Спочатку перевірте розмову. Повторне надсилання може дублювати відповідь.
      sk: Predchádzajúca požiadavka sa možno stále spracúva. Najprv skontrolujte konverzáciu. Opätovné odoslanie môže odpoveď zdvojiť.
      sr: Претходни захтев се можда још обрађује. Прво проверите разговор. Поновно слање може удвостручити одговор.
      hy: Նախորդ հարցումը կարող է դեռ մշակվել։ Նախ ստուգեք զրույցը։ Կրկին ուղարկելը կարող է կրկնօրինակել պատասխանը։
      kk: Алдыңғы сұрау әлі өңделіп жатуы мүмкін. Алдымен сөйлесуді тексеріңіз. Қайта жіберу жауапты қайталауы мүмкін.
      ms: Permintaan terdahulu mungkin masih diproses. Semak perbualan dahulu. Penghantaran semula mungkin menduplikasi balasan.
      tg: Дархости қаблӣ шояд ҳанӯз коркард мешавад. Аввал суҳбатро санҷед. Фиристодани такрорӣ метавонад ҷавобро дубора сабт кунад.
      uz: Oldingi so‘rov hali qayta ishlanayotgan bo‘lishi mumkin. Avval suhbatni tekshiring. Qayta yuborish javobning takrorlanishiga olib kelishi mumkin.
      zh: 之前的请求可能仍在处理中。请先检查对话，重新发送可能导致重复回复。
      vi: Yêu cầu trước có thể vẫn đang được xử lý. Hãy kiểm tra cuộc trò chuyện trước. Gửi lại có thể tạo phản hồi trùng lặp.
      th: คำขอก่อนหน้าอาจยังอยู่ระหว่างประมวลผล กรุณาตรวจสอบการสนทนาก่อน การส่งอีกครั้งอาจทำให้คำตอบซ้ำ
    auth.signUp.rollbackUnconfirmed:
      en: Could not confirm returning to the previous step. Check the conversation.
      ru: Не удалось подтвердить возврат на предыдущий шаг. Проверьте диалог.
      cs: Návrat k předchozímu kroku se nepodařilo potvrdit. Zkontrolujte konverzaci.
      fr: Impossible de confirmer le retour à l’étape précédente. Vérifiez la conversation.
      az: Əvvəlki addıma qayıdışı təsdiqləmək mümkün olmadı. Söhbəti yoxlayın.
      de: Die Rückkehr zum vorherigen Schritt konnte nicht bestätigt werden. Prüfen Sie den Chat.
      es: No se pudo confirmar la vuelta al paso anterior. Revisa la conversación.
      it: Impossibile confermare il ritorno al passaggio precedente. Controlla la conversazione.
      pt: Não foi possível confirmar o retorno à etapa anterior. Confira a conversa.
      uk: Не вдалося підтвердити повернення до попереднього кроку. Перевірте розмову.
      sk: Návrat k predchádzajúcemu kroku sa nepodarilo potvrdiť. Skontrolujte konverzáciu.
      sr: Није могуће потврдити повратак на претходни корак. Проверите разговор.
      hy: Չհաջողվեց հաստատել վերադարձը նախորդ քայլին։ Ստուգեք զրույցը։
      kk: Алдыңғы қадамға қайтуды растау мүмкін болмады. Сөйлесуді тексеріңіз.
      ms: Kembali ke langkah terdahulu tidak dapat disahkan. Semak perbualan.
      tg: Бозгашт ба қадами қаблӣ тасдиқ нашуд. Суҳбатро санҷед.
      uz: Oldingi bosqichga qaytishni tasdiqlab bo‘lmadi. Suhbatni tekshiring.
      zh: 无法确认是否已返回上一步，请检查对话。
      vi: Không xác nhận được việc quay lại bước trước. Hãy kiểm tra cuộc trò chuyện.
      th: ยืนยันการกลับไปขั้นตอนก่อนหน้าไม่สำเร็จ กรุณาตรวจสอบการสนทนา
